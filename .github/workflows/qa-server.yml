name: qa-server

on: [push]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          lfs: true
      # installs pnpm (`packageManager` in `package.json`) and node (`.nvmrc`), then dependencies of all workspace projects
      - name: setup pnpm / node, install dependencies
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true
      - name: build schema
        working-directory: schema
        run: make build
      - name: install dependencies (server / sqlc)
        run: make install-dependency-sqlc
      - name: lint
        working-directory: project/server
        run: make lint

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          lfs: true
      # installs pnpm (`packageManager` in `package.json`) and node (`.nvmrc`), then dependencies of all workspace projects
      - name: setup pnpm / node, install dependencies
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true
      - name: build schema
        working-directory: schema
        run: make build
      - name: install dependencies (server / sqlc)
        run: make install-dependency-sqlc
      - name: test
        working-directory: project/server
        run: make test
