DerivedDeviceConnectivity:
  type: string
  enum:
    - online
    - offline

DerivedDeviceCategorySource:
  type: string
  enum:
    - integration-manual
    - integration-inferred
DerivedDeviceCategory:
  type: object
  required:
    - id
    - source
  properties:
    id:
      $ref: "../../out/categorization.yaml#/Category"
    source:
      $ref: "#/DerivedDeviceCategorySource"

DerivedDeviceMono:
  allOf:
    - type: object
      required:
        - integration
        - manufacturer
        - first_encountered
        - versions
        - entities
      properties:
        integration:
          type: object
          required:
            - domain
            - name
          properties:
            name:
              type: string
            domain:
              type: string
        manufacturer:
          type: string
        connectivity:
          $ref: "#/DerivedDeviceConnectivity"
        first_encountered:
          type: string
          format: date-time
        versions:
          type: object
          required:
            - software
            - hardware
          properties:
            software:
              type: array
              items:
                type: object
                required:
                  - version
                  - first_encountered
                  - active
                properties:
                  version:
                    type: string
                  active:
                    type: integer
                  first_encountered:
                    type: string
                    format: date-time
            hardware:
              type: array
              items:
                type: object
                required:
                  - version
                properties:
                  version:
                    type: string
                  first_encountered:
                    type: string
                    format: date-time
        categories:
          type: array
          items:
            $ref: "#/DerivedDeviceCategory"
        entities:
          type: array
          items:
            type: object
            required:
              - domain
            properties:
              domain:
                type: string
              original_device_class:
                type: string
    - oneOf:
        - type: object
          required:
            - model
            - model_id
          properties:
            model:
              type: string
            model_id:
              type: string
        - type: object
          required:
            - model
          properties:
            model:
              type: string
            model_id:
              type: string
        - type: object
          required:
            - model_id
          properties:
            model:
              type: string
            model_id:
              type: string

DerivedDeviceMonoCountedDeduplicated:
  allOf:
    - $ref: "#/DerivedDeviceMono"
    - type: object
      required:
        - count
        - duplicates
      properties:
        count:
          type: integer
        duplicates:
          type: object
          required:
            - items
            - total
          properties:
            items:
              type: array
              items:
                $ref: "#/DerivedDevicePolyCounted"
            total:
              type: integer
            next:
              type: string
              format: uri

DerivedDevicePoly:
  allOf:
    - $ref: "#/DerivedDeviceMono"
    - $ref: "../snippet.yaml#/SnippetRef"
DerivedDevicePolyCounted:
  allOf:
    - $ref: "#/DerivedDevicePoly"
    - type: object
      required:
        - count
      properties:
        count:
          type: integer
DerivedDevicePolyCountedDeduplicated:
  allOf:
    - $ref: "#/DerivedDevicePolyCounted"
    - type: object
      required:
        - duplicates
      properties:
        duplicates:
          type: array
          items:
            $ref: "../snippet.yaml#/SnippetRef"
